name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and validate release archive
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Validate the tag and committed manifest version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          manifest_version="$(python3 -c 'import json; print(json.load(open("custom_components/contact_energy/manifest.json"))["version"])')"
          test "${RELEASE_TAG}" = "v${manifest_version}"
      - name: Build the deterministic integration archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/build_release.py \
            --expected-version "${RELEASE_TAG#v}" \
            --output dist/contact_energy.zip
          cp RELEASE_NOTES.md dist/release_notes.md
      - name: Verify archive integrity and checksum
        working-directory: dist
        run: |
          unzip -t contact_energy.zip
          sha256sum --check contact_energy.zip.sha256
      - name: Store verified release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contact-energy-release
          path: dist
          if-no-files-found: error

  publish:
    name: Publish verified release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: contact-energy-release
      - name: Create the stable GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: release_notes.md
          files: |
            contact_energy.zip
            contact_energy.zip.sha256
          generate_release_notes: false
          make_latest: true
          name: Contact Energy ${{ github.ref_name }}
          prerelease: false
