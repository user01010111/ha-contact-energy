name: Feature request
description: Suggest an improvement to the Contact Energy integration
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Explain the user problem first. A proposed implementation is welcome but is not required.
  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I searched the [existing Contact Energy feature requests](https://github.com/user01010111/ha-contact-energy/issues?q=is%3Aissue+label%3Aenhancement).
          required: true
        - label: This issue contains one feature request.
          required: true
        - label: I removed credentials, addresses, ICPs, and account or contract identifiers from text and screenshots.
          required: true
  - type: textarea
    attributes:
      label: Problem to solve
      description: Describe the current limitation and who it affects.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Suggested behavior
      description: Describe what you would like Home Assistant to do instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives or additional context
      description: Include relevant alternatives, screenshots, or examples with private details removed.
