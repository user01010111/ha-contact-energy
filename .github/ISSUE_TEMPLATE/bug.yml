name: Bug report
description: Report a problem with the Contact Energy integration
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Before opening a report, search the existing Contact Energy issues for the same problem.
  - type: textarea
    attributes:
      label: System Health details
      description: Paste only the relevant Home Assistant version and installation details. Remove network addresses, instance IDs, and unrelated integration details.
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I searched the [existing Contact Energy issues](https://github.com/user01010111/ha-contact-energy/issues?q=is%3Aissue).
          required: true
        - label: This report covers one problem.
          required: true
        - label: I replaced every email, physical address, ICP, account ID, contract ID, password, session token, API key, cookie, header, and usage URL with a clear placeholder.
          required: true
  - type: textarea
    attributes:
      label: Describe the issue
      description: Explain what happened and what you expected.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Relevant redacted log excerpt
      description: Paste the smallest excerpt that shows the failure. Do not submit full startup logs. Redact all identifiers, credentials, tokens, API keys, cookies, headers, addresses, and complete usage URLs before posting.
      render: text
    validations:
      required: true
